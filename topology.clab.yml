name: but3-datacenter

topology:
  nodes:
    # --- COUCHE SPINE ---
    spine1:
      kind: linux
      image: frrouting/frr:latest
      cap-add: [NET_ADMIN]
    spine2:
      kind: linux
      image: frrouting/frr:latest
      cap-add: [NET_ADMIN]

    # --- COUCHE LEAF ---
    leaf1:
      kind: linux
      image: frrouting/frr:latest
      cap-add: [NET_ADMIN]
    leaf2:
      kind: linux
      image: frrouting/frr:latest
      cap-add: [NET_ADMIN]
    leaf3:
      kind: linux
      image: frrouting/frr:latest
      cap-add: [NET_ADMIN]

    # --- SERVICES ET SÉCURITÉ ---
    srv-aaa:
      kind: linux
      image: alpine:latest
      cap-add: [NET_ADMIN]
    fw-inter-vrf:
      kind: linux
      image: wbitt/network-multitool
      cap-add: [NET_ADMIN]

    # --- POSTES CLIENTS ---
    client-prod:
      kind: linux
      image: wbitt/network-multitool
      cap-add: [NET_ADMIN]
    client-dev:
      kind: linux
      image: wbitt/network-multitool
      cap-add: [NET_ADMIN]

  links:
    # Spines vers Leafs
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
      mtu: 9000
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
      mtu: 9000
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
      mtu: 9000

    - endpoints: ["spine2:eth1", "leaf1:eth2"]
      mtu: 9000
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
      mtu: 9000
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
      mtu: 9000

    # Équipements vers Leafs
    - endpoints: ["leaf1:eth3", "srv-aaa:eth1"]
    - endpoints: ["leaf1:eth4", "client-prod:eth1"]
    - endpoints: ["leaf2:eth3", "fw-inter-vrf:eth1"]
    - endpoints: ["leaf3:eth3", "client-dev:eth1"]